<iframe id="f" allow="clipboard-write"></iframe>
<script>
  // 1) PEGA AQUI tu enlace largo de la web (el que acaba en /exec?token=...&accion=tabla)
  var BASE = "https://script.google.com/macros/s/AKfycbxCI6odh8LvQgJRUC7D172DEzcvVydZksn-ia9R61rD37MkHKngCWjvbymc8b9dJkMR2A/exec?token=barkiniela2026secreto&accion=tabla";

  // 2) lo demas no hay que tocarlo
  var f = document.getElementById('f'), u;
  try {
    u = new URL(BASE);
    new URLSearchParams(location.search).forEach(function(v, k) { u.searchParams.set(k, v); });
    f.src = u.toString();
  } catch (e) { document.body.innerHTML = '<p style="color:#fff;font:16px sans-serif;padding:20px">Falta pegar la direccion de la web en este archivo.</p>'; }

  var ld = document.getElementById('ld');
  try { var fe = localStorage.getItem('bk_fecha'), td = document.querySelector('#tl .tdf'); if (fe && td) td.setAttribute('data-d', fe); } catch (x) {}   // la fecha de la jornada que dejo la ultima visita
  function quita() { ld.className = 'off'; setTimeout(function() { ld.style.display = 'none'; }, 600); }
  // la pantalla de carga dura: jornada en juego = hasta que la tabla esta pintada; si no (antes de empezar o terminada) = al menos 3 segundos y hasta que la tabla esta pintada
  var t0 = Date.now(), listo = false;
  function fin(vivo) { setTimeout(quita, vivo ? 0 : Math.max(0, 3000 - (Date.now() - t0))); }
  window.addEventListener('message', function(e) {
    var d = e.data;
    if (listo || !d || d.bk !== 'listo') return;
    listo = true;
    try { localStorage.setItem('bk_vivo', d.vivo ? '1' : '0'); if (d.fecha) localStorage.setItem('bk_fecha', d.fecha); } catch (x) {}
    fin(!!d.vivo);
  });
  // respaldo (si la web no avisa): al cargar el marco se espera 1,5 s el aviso y si no llega se usa el ultimo estado conocido
  f.addEventListener('load', function() {
    setTimeout(function() {
      if (listo) return;
      listo = true;
      var v = false; try { v = localStorage.getItem('bk_vivo') === '1'; } catch (x) {}
      fin(v);
    }, 1500);
  });
  setTimeout(quita, 25000);
  try { (function() {   // pantalla de carga: el titulo a su tamano, escalado al ancho del movil y con la tragaperras alineada con las letras
    var tl = document.getElementById('tl'), sm = tl.querySelector('.tsm'), bl = tl.querySelector('.tbl');
    function rec(t) {   // mide donde queda cada cosa de la fila del golf (y las letras de arriba) para que el recorrido de la pelota y del dardo se ajuste al telefono u ordenador de cada uno
      var gi = t.querySelector('.te2'), ks = t.querySelectorAll('.tk'), db = t.querySelector('.te3'), fl = t.querySelector('.te4');
      if (!gi || ks.length < 4 || !db || !fl) return;
      var tt = gi.parentNode, F = parseFloat(getComputedStyle(tt).fontSize) * (typeof ZM === 'number' && ZM ? ZM : 1), g = gi.getBoundingClientRect();
      if (!F || !g.width) return;
      function px(e) { var r = e.getBoundingClientRect(); return (r.left + r.right) / 2; }
      function set(n, v) { if (isFinite(v)) tt.style.setProperty(n, v.toFixed(3)); }
      set('--k1', (px(ks[0]) - g.left) / F); set('--k2', (px(ks[1]) - g.left) / F); set('--k3', (px(ks[2]) - g.left) / F); set('--k4', (px(ks[3]) - g.left) / F);
      var rd = db.getBoundingClientRect(), rf = fl.getBoundingClientRect(), kr = ks[0].getBoundingClientRect();
      set('--kd', (px(db) - g.left) / F); set('--kdy', ((rd.top + rd.bottom) / 2 - g.top) / F);
      set('--kf', (rf.left + 0.58 * (rf.right - rf.left) - g.left) / F); set('--kfy', (rf.top + 0.82 * (rf.bottom - rf.top) - g.top) / F);
      set('--rt', (kr.top - g.top) / F); set('--rb', (kr.bottom - g.top) / F);
      var up = (rf.right - g.left) / F + 0.15;   // por donde sube el dardo: pegado a la derecha del banderin
      // letras de BARKINIELA (si estan en otra fila): ultima A, y el hueco entre la R y la K
      var wk = document.createTreeWalker(t, NodeFilter.SHOW_TEXT, null, false), nd, tx = null;
      while ((nd = wk.nextNode())) { if (nd.nodeValue.indexOf('BARKINIELA') >= 0) { tx = nd; break; } }
      if (tx) {
        var o = tx.nodeValue.indexOf('BARKINIELA'), rg = document.createRange();
        rg.setStart(tx, o + 9); rg.setEnd(tx, o + 10); var ra = rg.getBoundingClientRect();
        rg.setStart(tx, o + 2); rg.setEnd(tx, o + 4); var rk = rg.getBoundingClientRect();
        if (ra.width && ra.top < g.top - 2) {
          up = Math.max(up, (ra.right - g.left) / F + 0.35);
          set('--ba', Math.max(0.2, (rd.top - ra.bottom) / F + 0.25)); set('--ly', ((ra.top + ra.bottom) / 2 - g.top) / F); set('--krk', ((rk.left + rk.right) / 2 - g.left) / F);
        }
      }
      set('--kup', up);
    }
    function aj() {
      tl.style.transform = 'scale(' + Math.min(1.4, (window.innerWidth - 32) / 345) + ')';
      tl.style.transform = 'none';
      var k = Math.min(1.4, (window.innerWidth - 32) / 345);
      var meta = bl.getBoundingClientRect().bottom - 0.358 * 34 * 1.4167, cen = function() { var q = sm.getBoundingClientRect(); return (q.top + q.bottom) / 2; };
      document.documentElement.style.setProperty('--tsy', '0px'); var c0 = cen();
      document.documentElement.style.setProperty('--tsy', '10px'); var kk = (cen() - c0) / 10;
      if (kk > 0.05) document.documentElement.style.setProperty('--tsy', ((meta - c0) / kk) + 'px');
      rec(tl);
      tl.style.transform = 'scale(' + k + ')';
    }
    aj(); window.addEventListener('resize', aj);
  })(); } catch (e) {}

  // en el movil la web se disenia para 542 px de ancho: se muestra a ese ancho y se escala para llenar la pantalla
  function ajusta() {
    var w = window.innerWidth, h = window.innerHeight;
    if (w < 700) { var k = w / 542; f.style.width = '542px'; f.style.height = (h / k) + 'px'; f.style.transform = 'scale(' + k + ')'; }
    else { f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.transform = 'none'; }
  }
  window.addEventListener('resize', ajusta); window.addEventListener('orientationchange', ajusta); ajusta();

  // titulo de la pestana "animado": tres animaciones que se repiten en bucle (los titulos solo admiten texto, asi que se van cambiando los emojis)
  var A = 'LA', S = '🎰', B = 'BARKINIELA', G = '🏌️', N1 = '2️⃣6️⃣', W = '➿', N2 = '2️⃣7️⃣', F = '⛳️', BOLA = '⚪';
  function t(s, g, p0, p1, p2, p3, w, fl) { return A + s + B + g + (p0 || '') + N1 + (p1 || '') + w + (p2 || '') + N2 + (p3 || '') + fl; }
  var FR = [];
  // 1) la tragaperras gira
  ['🍒', '🔔', '7️⃣', '💰', S].forEach(function(s) { FR.push(t(s, G, '', '', '', '', W, F)); });
  // 2) la pelota sale del golfista, da saltos y entra en el agujero
  FR.push(t(S, G, BOLA, '', '', '', W, F));
  FR.push(t(S, G, '', BOLA, '', '', W, F));
  FR.push(t(S, G, '', '', BOLA, '', W, F));
  FR.push(t(S, G, '', '', '', BOLA, W, F));
  FR.push(t(S, G, '', '', '', '', W, F + '✨'));
  FR.push(t(S, G, '', '', '', '', W, F + '🎉'));
  // 3) el muelle rebota
  ['🌀', '🔁', W, '🌀', W].forEach(function(w) { FR.push(t(S, G, '', '', '', '', w, F)); });
  var i = 0, tm = null;
  function paso() { document.title = FR[i % FR.length]; i++; }
  function arranca() { if (!tm && !document.hidden) { paso(); tm = setInterval(paso, 450); } }
  function para() { if (tm) { clearInterval(tm); tm = null; } }
  // solo anima mientras la pestana esta a la vista; si se oculta o se minimiza, se para y no gasta nada
  document.addEventListener('visibilitychange', function() { if (document.hidden) para(); else arranca(); });
  arranca();
</script>
